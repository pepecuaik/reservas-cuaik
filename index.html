<style>
:root{
  --bg:#F6F4EF;
  --surface:#FFFFFF;
  --ink:#1F2A44;
  --ink-soft:#5B6478;
  --line:#E6E2D8;
  --accent:#1F2A44;
  --holiday:#FFE9A8;
  --holiday-strong:#FFD966;
  --puente:#FFF4D2;
  --danger:#C1502E;
  --radius:14px;
  --shadow:0 2px 10px rgba(31,42,68,0.06);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
body{padding-bottom:env(safe-area-inset-bottom);}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0;}
button{font-family:inherit;}
input,select{font-family:inherit;}

.app{max-width:960px;margin:0 auto;padding:16px 16px 48px;}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:18px 4px 14px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:17px;flex-shrink:0;}
.brand h1{font-size:19px;letter-spacing:0.2px;}
.brand span{display:block;font-family:inherit;font-size:11px;color:var(--ink-soft);margin-top:1px;}

.who-select{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 12px;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:6px;}
.who-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.who-select select{border:none;background:transparent;font-size:13px;color:var(--ink);appearance:none;padding-right:2px;}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;}
.month-nav{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:6px 8px;box-shadow:var(--shadow);}
.month-nav button{width:30px;height:30px;border-radius:50%;border:none;background:transparent;color:var(--ink);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.month-nav button:hover{background:var(--bg);}
.month-label{font-size:15px;font-weight:600;min-width:150px;text-align:center;text-transform:capitalize;}

.right-controls{display:flex;gap:8px;flex-wrap:wrap;}
select.prop-select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--ink);box-shadow:var(--shadow);}

.view-toggle{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);}
.view-toggle button{border:none;background:transparent;padding:9px 14px;font-size:13px;color:var(--ink-soft);cursor:pointer;}
.view-toggle button.active{background:var(--ink);color:#fff;}

.btn-primary{background:var(--ink);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);}
.btn-primary:hover{opacity:0.92;}

/* Legend */
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:2px 4px 16px;font-size:12px;color:var(--ink-soft);}
.legend-item{display:flex;align-items:center;gap:6px;}
.legend-swatch{width:10px;height:10px;border-radius:3px;}

/* Calendar */
.calendar-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);}
.weekdays div{padding:10px 4px;text-align:center;font-size:11px;color:var(--ink-soft);font-weight:600;letter-spacing:0.4px;text-transform:uppercase;}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.day-cell{min-height:88px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 5px;position:relative;cursor:pointer;transition:background .12s;}
.day-cell:nth-child(7n){border-right:none;}
.day-cell.outside{opacity:0.32;}
.day-cell:hover{background:#FAF9F5;}
.day-cell.holiday{background:var(--holiday);}
.day-cell.puente{background:var(--puente);}
.day-cell.holiday:hover{background:var(--holiday-strong);}
.day-num{font-size:12.5px;font-weight:600;color:var(--ink);}
.day-num.today{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;background:var(--ink);color:#fff;border-radius:50%;}
.holiday-label{font-size:9px;color:#8A6D1D;margin-top:1px;line-height:1.15;display:block;}
.turno-strip{height:4px;border-radius:3px;margin-bottom:3px;display:flex;gap:2px;overflow:hidden;}
.turno-strip span{flex:1;}
.turno-label{font-size:8.5px;font-weight:700;margin-top:1px;line-height:1.15;display:block;}
.res-bars{margin-top:4px;display:flex;flex-direction:column;gap:2px;}
.res-bar{font-size:9.5px;color:#fff;padding:2px 5px;border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
.res-dot-row{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap;}
.res-dot{width:7px;height:7px;border-radius:50%;}

/* List view */
.list-view{display:flex;flex-direction:column;gap:10px;}
.list-empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:32px;text-align:center;color:var(--ink-soft);font-size:13.5px;}
.list-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);cursor:pointer;}
.list-color{width:8px;align-self:stretch;border-radius:4px;flex-shrink:0;min-height:38px;}
.list-info{flex:1;min-width:0;}
.list-prop{font-size:14px;font-weight:600;}
.list-dates{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.list-family{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.shared-badge{display:inline-block;font-size:10px;background:#EEF1F7;color:var(--ink-soft);padding:2px 7px;border-radius:20px;margin-left:6px;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(31,42,68,0.45);display:flex;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(2px);}
@media(min-width:640px){.overlay{align-items:center;}}
.modal{background:var(--surface);width:100%;max-width:420px;border-radius:18px 18px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;}
@media(min-width:640px){.modal{border-radius:18px;}}
.modal h2{font-size:18px;margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:600;}
.field select,.field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14.5px;background:#FCFBF8;color:var(--ink);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.btn-secondary{flex:1;background:transparent;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:14px;color:var(--ink-soft);cursor:pointer;}
.btn-danger{background:var(--danger);color:#fff;border:none;border-radius:10px;padding:11px;font-size:14px;cursor:pointer;flex:1;}
.btn-confirm{flex:1;background:var(--ink);color:#fff;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;}
.modal-close{position:absolute;top:14px;right:16px;border:none;background:transparent;font-size:20px;color:var(--ink-soft);cursor:pointer;}
.modal{position:relative;}
.error-msg{color:var(--danger);font-size:12.5px;margin-top:6px;}
.info-box{background:#F5F1E8;border-radius:10px;padding:12px 13px;font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;line-height:1.5;}
.conflict-box{background:#FDEDEA;border:1px solid #F3C6BC;border-radius:10px;padding:13px;font-size:13px;color:#8A3A26;margin-bottom:14px;line-height:1.5;}

.detail-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.detail-row span:first-child{color:var(--ink-soft);}
.detail-row:last-of-type{border-bottom:none;}

.fab-space{height:14px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:24px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,0.2);z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}

.conn-badge{font-size:10.5px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;margin:0 4px 10px;}
.conn-dot{width:7px;height:7px;border-radius:50%;background:#3FAE5C;}
.conn-dot.off{background:#C1502E;}

::-webkit-scrollbar{width:0;height:0;}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, remove, onValue, query, orderByChild } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ---------------- Firebase ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyDETYcKWrjBPg3b1yl4vpO32mnnYkd2O3I",
  authDomain: "cuaik-family.firebaseapp.com",
  databaseURL: "https://cuaik-family-default-rtdb.firebaseio.com",
  projectId: "cuaik-family",
  storageBucket: "cuaik-family.firebasestorage.app",
  messagingSenderId: "413209776700",
  appId: "1:413209776700:web:e4cb6b07df4ce98656a939"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const resRef = ref(db, "reservations");

/* ---------------- Data ---------------- */
const FAMILIES = [
  { id:"pap", name:"Papá",     spouse:"Teresa Rivera Torres", pin:"PAP", color:"#B0532F" },
  { id:"pep", name:"Pepe",     spouse:"Carla Braun",          pin:"PEP", color:"#2A6F97" },
  { id:"die", name:"Diego",    spouse:"Lorenza Bernot",       pin:"DIE", color:"#4C8C5F" },
  { id:"san", name:"Santiago", spouse:"Ximena Urquiza",       pin:"SAN", color:"#7B5EA7" },
  { id:"ter", name:"Tere",     spouse:"Beto (Alberto Siman)", pin:"TER", color:"#C1447E" },
];

const PROPERTIES = [
  { id:"trebol",          name:"Rancho El Trébol" },
  { id:"sayavedra",       name:"Rancho Sayavedra" },
  { id:"coronado503",     name:"Coronado 503" },
  { id:"coronado504",     name:"Coronado 504" },
  { id:"coronado1209",    name:"Coronado 1209" },
  { id:"houston18f",      name:"Houston 18F" },
  { id:"houston14a",      name:"Houston 14A" },
  { id:"ixtapa",          name:"Ixtapa" },
  { id:"puertoaventuras", name:"Puerto Aventuras" },
  { id:"yatenueve",       name:"Yate Nueve" },
];

const famById = Object.fromEntries(FAMILIES.map(f=>[f.id,f]));
const propById = Object.fromEntries(PROPERTIES.map(p=>[p.id,p]));

/* "Turnos" = weeks when it's the whole Cuaik family's turn on a shared-rotation property,
   per the family's master calendar (Excel). Not tied to one nuclear family/PIN — shown as a
   colored band on the calendar so everyone knows when the property is available to us. */
const TURNO_COLORS = {
  puertoaventuras: "#16A3B0",
  yatenueve:       "#1D3557",
  sayavedra:       "#8C6239",
};
const TURNOS = [
  // Yate Nueve
  { property:"yatenueve", start:"2026-03-27", end:"2026-04-03" },
  { property:"yatenueve", start:"2026-04-16", end:"2026-04-20" },
  { property:"yatenueve", start:"2026-06-18", end:"2026-06-22" },
  { property:"yatenueve", start:"2026-08-27", end:"2026-08-31" },
  { property:"yatenueve", start:"2026-11-12", end:"2026-11-16" },
  // Puerto Aventuras
  { property:"puertoaventuras", start:"2025-12-19", end:"2025-12-26" },
  { property:"puertoaventuras", start:"2026-02-26", end:"2026-03-02" },
  { property:"puertoaventuras", start:"2026-05-14", end:"2026-05-18" },
  { property:"puertoaventuras", start:"2026-07-23", end:"2026-07-27" },
  { property:"puertoaventuras", start:"2026-10-01", end:"2026-10-05" },
  { property:"puertoaventuras", start:"2026-12-03", end:"2026-12-07" },
  // Rancho Sayavedra
  { property:"sayavedra", start:"2026-01-23", end:"2026-01-25" },
  { property:"sayavedra", start:"2026-03-06", end:"2026-03-08" },
  { property:"sayavedra", start:"2026-07-10", end:"2026-07-16" },
  { property:"sayavedra", start:"2026-09-18", end:"2026-09-20" },
  { property:"sayavedra", start:"2026-11-20", end:"2026-11-22" },
  { property:"sayavedra", start:"2027-02-05", end:"2027-02-07" },
];

const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS_CORTOS = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];

/* ---------------- Mexican holidays (computed per year) ---------------- */
function nthMondayOfMonth(year, month, n){ // month: 0-indexed
  const d = new Date(year, month, 1);
  let count = 0;
  while(true){
    if(d.getDay() === 1){ count++; if(count===n) return new Date(d); }
    d.setDate(d.getDate()+1);
  }
}
function easterSunday(year){
  // Anonymous Gregorian algorithm
  const a = year % 19, b = Math.floor(year/100), c = year % 100;
  const d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3), h = (19*a+b-d-g+15)%30;
  const i = Math.floor(c/4), k = c % 4;
  const l = (32+2*e+2*i-h-k)%7;
  const m = Math.floor((a+11*h+22*l)/451);
  const month = Math.floor((h+l-7*m+114)/31);
  const day = ((h+l-7*m+114)%31)+1;
  return new Date(year, month-1, day);
}
function fmt(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

const holidayCache = {};
function getHolidaysForYear(year){
  if(holidayCache[year]) return holidayCache[year];
  const map = {};
  const addFixed = (m,d,name)=>{
    const dt = new Date(year,m,d);
    map[fmt(dt)] = {name, type:"holiday"};
    const dow = dt.getDay(); // 0 Sun..6 Sat
    if(dow===2){ const mon=new Date(dt); mon.setDate(dt.getDate()-1); map[fmt(mon)] = map[fmt(mon)]||{name:"Puente ("+name+")", type:"puente"}; }
    if(dow===4){ const fri=new Date(dt); fri.setDate(dt.getDate()+1); map[fmt(fri)] = map[fmt(fri)]||{name:"Puente ("+name+")", type:"puente"}; }
  };
  addFixed(0,1,"Año Nuevo");
  addFixed(4,1,"Día del Trabajo");
  addFixed(8,16,"Día de la Independencia");
  addFixed(11,25,"Navidad");

  const feb = nthMondayOfMonth(year,1,1); map[fmt(feb)] = {name:"Día de la Constitución", type:"holiday"};
  const mar = nthMondayOfMonth(year,2,3); map[fmt(mar)] = {name:"Natalicio de Benito Juárez", type:"holiday"};
  const nov = nthMondayOfMonth(year,10,3); map[fmt(nov)] = {name:"Día de la Revolución", type:"holiday"};

  const easter = easterSunday(year);
  const thu = new Date(easter); thu.setDate(easter.getDate()-3);
  const fri = new Date(easter); fri.setDate(easter.getDate()-2);
  map[fmt(thu)] = {name:"Jueves Santo", type:"holiday"};
  map[fmt(fri)] = {name:"Viernes Santo", type:"holiday"};

  const muertosDay = new Date(year,10,2);
  map[fmt(muertosDay)] = map[fmt(muertosDay)] || {name:"Día de Muertos", type:"puente"};

  if((year-2024)%6===0){ const dec1=new Date(year,11,1); map[fmt(dec1)]={name:"Transmisión del Poder Ejecutivo", type:"holiday"}; }

  holidayCache[year]=map;
  return map;
}

/* ---------------- State ---------------- */
let current = new Date(); current.setDate(1);
let view = "calendar";
let selectedProp = "all";
let reservations = {}; // id -> {property, familyId, start, end, shared}
let firebaseOnline = false;

const savedWho = localStorage.getItem("cuaik_who");
let whoId = savedWho && famById[savedWho] ? savedWho : FAMILIES[0].id;

/* ---------------- Firebase listeners ---------------- */
onValue(resRef, (snap)=>{
  firebaseOnline = true;
  updateConnBadge();
  const val = snap.val() || {};
  reservations = val;
  render();
}, (err)=>{
  firebaseOnline = false;
  updateConnBadge();
  console.error(err);
});

function updateConnBadge(){
  const dot = document.getElementById("connDot");
  const label = document.getElementById("connLabel");
  if(firebaseOnline){ dot.classList.remove("off"); label.textContent = "Conectado en tiempo real"; }
  else { dot.classList.add("off"); label.textContent = "Sin conexión — reintentando…"; }
}

/* ---------------- UI: static selects ---------------- */
function buildWhoSelect(){
  const sel = document.getElementById("whoSelect");
  sel.innerHTML = FAMILIES.map(f=>`<option value="${f.id}" ${f.id===whoId?"selected":""}>${f.name} y ${f.spouse.split(" ")[0]}</option>`).join("");
  sel.onchange = ()=>{ whoId = sel.value; localStorage.setItem("cuaik_who", whoId); paintWhoDot(); };
  paintWhoDot();
}
function paintWhoDot(){
  document.getElementById("whoDot").style.background = famById[whoId].color;
}
function buildPropSelect(){
  const sel = document.getElementById("propSelect");
  sel.innerHTML = `<option value="all">Todas las propiedades</option>` +
    PROPERTIES.map(p=>`<option value="${p.id}">${p.name}</option>`).join("");
  sel.value = selectedProp;
  sel.onchange = ()=>{ selectedProp = sel.value; render(); };
}
function buildLegend(){
  const el = document.getElementById("legend");
  el.innerHTML = FAMILIES.map(f=>`<div class="legend-item"><span class="legend-swatch" style="background:${f.color}"></span>${f.name}</div>`).join("") +
    `<div class="legend-item"><span class="legend-swatch" style="background:var(--holiday-strong)"></span>Feriado oficial</div>` +
    `<div class="legend-item"><span class="legend-swatch" style="background:var(--puente)"></span>Puente</div>` +
    `<div class="legend-item"><span class="legend-swatch" style="background:${TURNO_COLORS.puertoaventuras}"></span>Turno Puerto Aventuras</div>` +
    `<div class="legend-item"><span class="legend-swatch" style="background:${TURNO_COLORS.yatenueve}"></span>Turno Yate Nueve</div>` +
    `<div class="legend-item"><span class="legend-swatch" style="background:${TURNO_COLORS.sayavedra}"></span>Turno Sayavedra</div>`;
}

document.getElementById("prevMonth").onclick = ()=>{ current.setMonth(current.getMonth()-1); render(); };
document.getElementById("nextMonth").onclick = ()=>{ current.setMonth(current.getMonth()+1); render(); };
document.getElementById("viewCalBtn").onclick = ()=>{ view="calendar"; render(); };
document.getElementById("viewListBtn").onclick = ()=>{ view="list"; render(); };
document.getElementById("newResBtn").onclick = ()=>openNewResModal();

/* ---------------- Date helpers ---------------- */
function isoDate(d){ return fmt(d); }
function parseISO(s){ const [y,m,dd] = s.split("-").map(Number); return new Date(y,m-1,dd); }
function overlaps(aStart,aEnd,bStart,bEnd){ return aStart <= bEnd && bStart <= aEnd; }
function daysArrayForMonth(year, month){
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay()+6)%7; // Monday=0
  const gridStart = new Date(first); gridStart.setDate(1-startOffset);
  const days = [];
  for(let i=0;i<42;i++){ const d = new Date(gridStart); d.setDate(gridStart.getDate()+i); days.push(d); }
  return days;
}

function reservationsForProperty(propId){
  return Object.entries(reservations)
    .filter(([id,r])=>propId==="all" || r.property===propId)
    .map(([id,r])=>({id, ...r}));
}

/* ---------------- Render ---------------- */
function render(){
  document.getElementById("monthLabel").textContent = `${MESES[current.getMonth()]} ${current.getFullYear()}`;
  document.getElementById("viewCalBtn").classList.toggle("active", view==="calendar");
  document.getElementById("viewListBtn").classList.toggle("active", view==="list");
  document.getElementById("calendarView").style.display = view==="calendar" ? "" : "none";
  document.getElementById("listView").style.display = view==="list" ? "" : "none";
  if(view==="calendar") renderCalendar(); else renderList();
}

function renderCalendar(){
  const grid = document.getElementById("daysGrid");
  grid.innerHTML = "";
  const year = current.getFullYear(), month = current.getMonth();
  const days = daysArrayForMonth(year, month);
  const todayStr = isoDate(new Date());
  const holidaysThis = getHolidaysForYear(year);
  const holidaysPrev = getHolidaysForYear(year - (month===0?1:0) || year);
  const holidaysNext = getHolidaysForYear(year + (month===11?1:0) || year);

  const allRes = reservationsForProperty(selectedProp);

  days.forEach(d=>{
    const dStr = isoDate(d);
    const outside = d.getMonth() !== month;
    const hol = getHolidaysForYear(d.getFullYear())[dStr];
    const cell = document.createElement("div");
    cell.className = "day-cell" + (outside?" outside":"") + (hol? (hol.type==="holiday"?" holiday":" puente") : "");
    cell.title = hol ? hol.name : "";

    const numSpan = document.createElement("span");
    numSpan.className = "day-num" + (dStr===todayStr ? " today":"");
    numSpan.textContent = d.getDate();
    cell.appendChild(numSpan);

    if(hol){
      const lbl = document.createElement("span");
      lbl.className = "holiday-label";
      lbl.textContent = hol.name;
      cell.appendChild(lbl);
    }

    const dayTurnos = TURNOS.filter(t=> (selectedProp==="all" || t.property===selectedProp) && overlaps(parseISO(t.start), parseISO(t.end), d, d));
    if(dayTurnos.length){
      const strip = document.createElement("div");
      strip.className = "turno-strip";
      dayTurnos.forEach(t=>{
        const seg = document.createElement("span");
        seg.style.background = TURNO_COLORS[t.property];
        strip.appendChild(seg);
      });
      cell.appendChild(strip);
      const lbl = document.createElement("span");
      lbl.className = "turno-label";
      lbl.style.color = TURNO_COLORS[dayTurnos[0].property];
      lbl.textContent = dayTurnos.length===1 ? "Turno "+propById[dayTurnos[0].property].name : "Turno familiar";
      cell.appendChild(lbl);
    }

    const dayRes = allRes.filter(r=> overlaps(parseISO(r.start), parseISO(r.end), d, d));
    if(dayRes.length){
      if(selectedProp === "all"){
        const dotRow = document.createElement("div");
        dotRow.className = "res-dot-row";
        dayRes.slice(0,8).forEach(r=>{
          const dot = document.createElement("span");
          dot.className = "res-dot";
          dot.style.background = famById[r.familyId].color;
          dotRow.appendChild(dot);
        });
        cell.appendChild(dotRow);
      } else {
        const barsWrap = document.createElement("div");
        barsWrap.className = "res-bars";
        dayRes.slice(0,3).forEach(r=>{
          const bar = document.createElement("div");
          bar.className = "res-bar";
          bar.style.background = famById[r.familyId].color;
          bar.textContent = famById[r.familyId].name + (dayRes.length>1?" 🤝":"");
          bar.onclick = (e)=>{ e.stopPropagation(); openDetailModal(r); };
          barsWrap.appendChild(bar);
        });
        cell.appendChild(barsWrap);
      }
    }

    cell.onclick = ()=>{
      if(dayRes.length===1 && selectedProp!=="all"){ openDetailModal(dayRes[0]); }
      else { openNewResModal(dStr, selectedProp!=="all"?selectedProp:null); }
    };

    grid.appendChild(cell);
  });
}

function renderList(){
  const wrap = document.getElementById("listView");
  const all = reservationsForProperty(selectedProp)
    .filter(r=> parseISO(r.end) >= new Date(current.getFullYear(), current.getMonth(), 1) &&
                parseISO(r.start) <= new Date(current.getFullYear(), current.getMonth()+1, 0))
    .sort((a,b)=> parseISO(a.start) - parseISO(b.start));

  if(!all.length){
    wrap.innerHTML = `<div class="list-empty">No hay reservas este mes${selectedProp!=="all" ? " para "+propById[selectedProp].name : ""}.</div>`;
    return;
  }
  wrap.innerHTML = "";
  all.forEach(r=>{
    const fam = famById[r.familyId];
    const prop = propById[r.property];
    const shared = reservationsForProperty(r.property).filter(o=>o.id!==r.id && overlaps(parseISO(o.start),parseISO(o.end),parseISO(r.start),parseISO(r.end)));
    const item = document.createElement("div");
    item.className = "list-item";
    item.innerHTML = `
      <div class="list-color" style="background:${fam.color}"></div>
      <div class="list-info">
        <div class="list-prop">${prop.name} ${shared.length?'<span class="shared-badge">Compartida</span>':''}</div>
        <div class="list-dates">${fmtRange(r.start,r.end)}</div>
        <div class="list-family">${fam.name} y ${fam.spouse.split(" ")[0]}</div>
      </div>`;
    item.onclick = ()=>openDetailModal(r);
    wrap.appendChild(item);
  });
}

function fmtRange(startISO,endISO){
  const s = parseISO(startISO), e = parseISO(endISO);
  const opt = {day:"numeric", month:"short"};
  if(startISO===endISO) return s.toLocaleDateString("es-MX",opt);
  return `${s.toLocaleDateString("es-MX",opt)} → ${e.toLocaleDateString("es-MX",opt)}`;
}

/* ---------------- Toast ---------------- */
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove("show"), 2600);
}

/* ---------------- Modals ---------------- */
function closeModal(){
  const ov = document.querySelector(".overlay");
  if(ov) ov.remove();
}

function openNewResModal(prefDate, prefProp){
  closeModal();
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };

  const propOptions = PROPERTIES.map(p=>`<option value="${p.id}" ${p.id===prefProp?"selected":""}>${p.name}</option>`).join("");
  const famOptions = FAMILIES.map(f=>`<option value="${f.id}" ${f.id===whoId?"selected":""}>${f.name} y ${f.spouse.split(" ")[0]}</option>`).join("");

  overlay.innerHTML = `
    <div class="modal">
      <button class="modal-close" id="closeBtn">✕</button>
      <h2>Nueva reserva</h2>
      <div id="conflictSlot"></div>
      <div class="field">
        <label>Propiedad</label>
        <select id="fProp">${propOptions}</select>
      </div>
      <div class="field">
        <label>Familia que reserva</label>
        <select id="fFam">${famOptions}</select>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Llegada</label>
          <input type="date" id="fStart" value="${prefDate||""}">
        </div>
        <div class="field">
          <label>Salida</label>
          <input type="date" id="fEnd" value="${prefDate||""}">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancelBtn">Cancelar</button>
        <button class="btn-confirm" id="saveBtn">Guardar reserva</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById("closeBtn").onclick = closeModal;
  document.getElementById("cancelBtn").onclick = closeModal;
  document.getElementById("saveBtn").onclick = ()=>attemptSave(false);

  function attemptSave(forceShare){
    const property = document.getElementById("fProp").value;
    const familyId = document.getElementById("fFam").value;
    const start = document.getElementById("fStart").value;
    const end = document.getElementById("fEnd").value || start;
    const slot = document.getElementById("conflictSlot");
    slot.innerHTML = "";

    if(!start){ slot.innerHTML = `<div class="error-msg">Elige al menos la fecha de llegada.</div>`; return; }
    if(parseISO(end) < parseISO(start)){ slot.innerHTML = `<div class="error-msg">La salida no puede ser antes de la llegada.</div>`; return; }

    const conflicts = reservationsForProperty(property).filter(r=> overlaps(parseISO(r.start),parseISO(r.end),parseISO(start),parseISO(end)) && r.familyId!==familyId);

    if(conflicts.length && !forceShare){
      const names = [...new Set(conflicts.map(c=>famById[c.familyId].name))].join(", ");
      slot.innerHTML = `
        <div class="conflict-box">
          <strong>${propById[property].name}</strong> ya tiene una reserva de <strong>${names}</strong> que se cruza con esas fechas.
          ¿Quieren compartir la propiedad en esos días?
        </div>
        <div class="modal-actions" style="margin-top:0;margin-bottom:14px;">
          <button class="btn-secondary" id="cancelShareBtn">Cambiar fechas</button>
          <button class="btn-confirm" id="shareBtn">Sí, compartir</button>
        </div>`;
      document.getElementById("cancelShareBtn").onclick = ()=>{ slot.innerHTML=""; };
      document.getElementById("shareBtn").onclick = ()=>attemptSave(true);
      return;
    }

    push(resRef, { property, familyId, start, end, createdAt: Date.now(), createdBy: whoId });
    closeModal();
    toast("Reserva guardada ✓");
  }
}

function openDetailModal(r){
  closeModal();
  const fam = famById[r.familyId];
  const prop = propById[r.property];
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  overlay.innerHTML = `
    <div class="modal">
      <button class="modal-close" id="closeBtn2">✕</button>
      <h2>${prop.name}</h2>
      <div class="detail-row"><span>Familia</span><span>${fam.name} y ${fam.spouse.split(" ")[0]}</span></div>
      <div class="detail-row"><span>Fechas</span><span>${fmtRange(r.start,r.end)}</span></div>
      <div class="field" style="margin-top:16px;">
        <label>PIN para cancelar (3 letras)</label>
        <input type="text" id="pinInput" maxlength="3" placeholder="Ej. ${fam.pin}" style="text-transform:uppercase;">
      </div>
      <div id="pinError"></div>
      <div class="modal-actions">
        <button class="btn-secondary" id="closeBtn3">Cerrar</button>
        <button class="btn-danger" id="delBtn">Cancelar reserva</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById("closeBtn2").onclick = closeModal;
  document.getElementById("closeBtn3").onclick = closeModal;
  document.getElementById("delBtn").onclick = ()=>{
    const pin = document.getElementById("pinInput").value.trim().toUpperCase();
    if(pin !== fam.pin){
      document.getElementById("pinError").innerHTML = `<div class="error-msg">PIN incorrecto.</div>`;
      return;
    }
    remove(ref(db, "reservations/"+r.id));
    closeModal();
    toast("Reserva cancelada");
  };
}

/* ---------------- Init ---------------- */
buildWhoSelect();
buildPropSelect();
buildLegend();
render();

/* ---------------- Service worker ---------------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
